<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault TSA — Retrait confirmé</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<main class="screen theme-light" style="align-items:center; justify-content:center; text-align:center; padding:40px 24px;">

  <div style="width:64px; height:64px; border-radius:50%; background:var(--success-bg); display:flex; align-items:center; justify-content:center; margin-bottom:20px;">
    <i class="ti ti-circle-check" style="font-size:32px; color:var(--success);"></i>
  </div>

  <p style="font-size:17px; font-weight:600; margin-bottom:8px;">Retrait en cours</p>
  <p id="amount-text" style="font-size:26px; font-weight:600; color:var(--blue-deep); margin-bottom:12px;">4 560 $</p>
  <p style="font-size:13px; color:var(--ink-600); line-height:1.6; margin-bottom:24px;">
    Votre demande de retrait a été envoyée. Les fonds arrivent généralement sous 1 à 3 jours ouvrés
    selon le moyen choisi.
  </p>

  <div class="card" style="width:100%; margin-bottom:20px;">
    <p style="font-size:12px; color:var(--ink-600); line-height:1.5;">
      Votre solde disponible a été mis à jour dans votre historique de ventes.
    </p>
  </div>

  <a href="history.html" class="btn btn-primary" style="width:100%;">Retour à l'historique</a>

</main>
<script src="app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const amount = params.get('amount') || '4560';
  document.getElementById('amount-text').textContent = Number(amount).toLocaleString('fr-FR') + ' $';
</script>
</body>
</html>
