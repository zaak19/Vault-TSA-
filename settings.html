<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault TSA — Paramètres</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  .settings-list { display:flex; flex-direction:column; gap:1px; background:var(--navy-line); border-radius:14px; overflow:hidden; margin-bottom:24px; }
  .settings-item { background:var(--navy-800); padding:14px 16px; display:flex; align-items:center; justify-content:space-between; text-decoration:none; color:inherit; cursor:pointer; }
  .settings-item .left { display:flex; align-items:center; gap:12px; }
</style>
</head>
<body>
<main class="screen theme-dark">

  <p style="font-size:18px; font-weight:600; margin-bottom:24px;">Paramètres</p>

  <a href="profile-edit.html" class="card" style="display:flex; align-items:center; gap:14px; margin-bottom:24px; text-decoration:none; color:inherit;">
    <div class="avatar" style="width:50px; height:50px; font-size:16px;">J.D</div>
    <div>
      <p style="font-size:15px; font-weight:600;">Mon profil</p>
      <p style="font-size:12px; color:var(--text-faint); margin-top:3px;">Voir et modifier mes informations</p>
    </div>
  </a>

  <p class="section-label">Compte</p>
  <div class="settings-list">
    <a href="#" class="settings-item">
      <div class="left"><i class="ti ti-lock" style="font-size:17px; color:var(--text-muted);"></i><span style="font-size:13.5px;">Modifier le mot de passe</span></div>
      <i class="ti ti-chevron-right" style="font-size:16px; color:var(--text-faint);"></i>
    </a>
    <a href="seller-step1.html" class="settings-item">
      <div class="left"><i class="ti ti-tag" style="font-size:17px; color:var(--text-muted);"></i><span style="font-size:13.5px;">Modifier mon prix / vendre mon contact</span></div>
      <i class="ti ti-chevron-right" style="font-size:16px; color:var(--text-faint);"></i>
    </a>
    <a href="#" class="settings-item">
      <div class="left"><i class="ti ti-bell" style="font-size:17px; color:var(--text-muted);"></i><span style="font-size:13.5px;">Notifications</span></div>
      <i class="ti ti-chevron-right" style="font-size:16px; color:var(--text-faint);"></i>
    </a>
  </div>

  <p class="section-label">Zone sensible</p>
  <div class="settings-list">
    <a href="index.html" class="settings-item">
      <div class="left"><i class="ti ti-logout" style="font-size:17px; color:var(--text-muted);"></i><span style="font-size:13.5px;">Se déconnecter</span></div>
    </a>
    <a href="#" class="settings-item" onclick="return confirm('Supprimer définitivement votre compte ? Cette action est irréversible.');">
      <div class="left"><i class="ti ti-trash" style="font-size:17px; color:var(--danger);"></i><span style="font-size:13.5px; color:var(--danger);">Supprimer mon compte définitivement</span></div>
    </a>
  </div>

  <div class="spacer"></div>

  <nav class="tabbar">
    <a href="browse.html" class="tab"><i class="ti ti-home" style="font-size:20px;"></i><span>Accueil</span></a>
    <a href="#" class="tab"><i class="ti ti-heart" style="font-size:20px;"></i><span>Favoris</span></a>
    <a href="settings.html" class="tab active"><i class="ti ti-settings" style="font-size:20px;"></i><span>Paramètres</span></a>
  </nav>

</main>
<script src="js/app.js"></script>
</body>
</html>
