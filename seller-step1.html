<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault TSA — Vendre mon contact (1/2)</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<main class="screen theme-dark">

  <button class="back-link" onclick="window.location.href='settings.html'"><i class="ti ti-arrow-left"></i><span class="title">Vendre mon contact</span></button>
  <p class="step-label" style="padding-left:26px;">Étape 1 sur 2</p>
  <div class="progress"><div class="bar filled"></div><div class="bar"></div></div>

  <div id="lock-banner-zone"></div>

  <div id="seller-editable-fields">
  <div style="margin-bottom:24px;">
    <label style="font-size:13px; color:var(--text-muted); display:block; margin-bottom:10px;">Catégorie de profil</label>
    <div class="chip-group">
      <div class="chip selected"><i class="ti ti-microphone-2"></i>Artiste</div>
      <div class="chip"><i class="ti ti-movie"></i>Acteur</div>
      <div class="chip"><i class="ti ti-star"></i>Célébrité</div>
      <div class="chip"><i class="ti ti-ball-football"></i>Footballeur</div>
      <div class="chip"><i class="ti ti-building-bank"></i>Homme politique</div>
      <div class="chip"><i class="ti ti-briefcase"></i>Entrepreneur</div>
      <div class="chip"><i class="ti ti-dots"></i>Autre</div>
    </div>
  </div>

  <div style="margin-bottom:24px;">
    <label style="font-size:12.5px; color:var(--text-muted); display:block; margin-bottom:8px;">Fixer mon prix (entre 50 $ et 200 000 $)</label>
    <div style="position:relative;">
      <span style="position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-faint); font-size:15px;">$</span>
      <input type="text" id="price-input" value="2 400" style="width:100%; height:50px; border-radius:12px; background:var(--navy-800); border:1px solid var(--blue-accent); color:#fff; padding:0 14px 0 28px; font-size:18px; font-weight:600;">
    </div>
    <input type="range" id="price-range" min="50" max="200000" value="2400" style="width:100%; margin-top:10px; accent-color:var(--blue-accent);">
    <div style="display:flex; justify-content:space-between; margin-top:2px;">
      <span style="font-size:11px; color:var(--text-ghost);">50 $</span>
      <span style="font-size:11px; color:var(--text-ghost);">200 000 $</span>
    </div>
    <p class="field-hint" style="margin-top:10px;">
      <i class="ti ti-info-circle" style="font-size:12px; vertical-align:-1px;"></i>
      La mise en vente est gratuite. Vault TSA prélève une commission de 5 % sur chaque vente conclue.
    </p>
  </div>

  <div class="toggle-row">
    <div class="toggle-label"><i class="ti ti-tag" style="font-size:18px; color:var(--blue-accent);"></i><span>Mettre mon contact en vente</span></div>
    <div class="switch on"><div class="knob"></div></div>
  </div>
  </div>

  <div class="spacer"></div>

  <button class="btn btn-primary" id="seller-step1-next" onclick="window.location.href='seller-step2.html'">Suivant</button>

</main>
<script src="app.js"></script>
<script>
  applyVaultEditLock('vault_seller_last_edit', '#seller-editable-fields', '#lock-banner-zone', '#seller-step1-next');
</script>
</body>
</html>
