<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault TSA — Créer un compte</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<main class="screen theme-dark">

  <div class="header" style="margin-bottom:28px;">
    <div class="icon-btn"><i class="ti ti-user-plus"></i></div>
    <p class="title">Créer un compte</p>
  </div>

  <form style="display:flex; flex-direction:column; flex:1;" onsubmit="event.preventDefault(); window.location.href='browse.html';">
    <div style="display:flex; flex-direction:column; gap:16px; flex:1;">
      <div class="field">
        <label>Adresse email</label>
        <input type="email" placeholder="nom@exemple.com" required>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" placeholder="8 caractères minimum" required minlength="8">
      </div>
      <div class="field">
        <label>Confirmer le mot de passe</label>
        <input type="password" placeholder="Retapez votre mot de passe" required minlength="8">
      </div>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px; margin-top:20px;">
      <button type="submit" class="btn btn-primary">Valider mon compte</button>
      <p style="text-align:center; font-size:12.5px; color:var(--text-faint);">
        Déjà inscrit ? <a href="login.html" style="color:var(--blue-accent); text-decoration:none;">Se connecter</a>
      </p>
    </div>
  </form>

</main>
<script src="app.js"></script>
</body>
</html>
