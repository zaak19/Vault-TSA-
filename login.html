<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault TSA — Se connecter</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<main class="screen theme-dark">

  <div class="header" style="margin-bottom:28px;">
    <div class="icon-btn"><i class="ti ti-login-2"></i></div>
    <p class="title">Se connecter</p>
  </div>

  <form style="display:flex; flex-direction:column; flex:1;" onsubmit="event.preventDefault(); window.location.href='browse.html';">
    <div style="display:flex; flex-direction:column; gap:16px; flex:1;">
      <div class="field">
        <label>Adresse email</label>
        <input type="email" placeholder="nom@exemple.com" required>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" placeholder="Votre mot de passe" required>
      </div>
      <p style="font-size:12.5px; color:var(--blue-accent); text-align:right; margin-top:-6px; cursor:pointer;">
        Mot de passe oublié ?
      </p>
    </div>

    <div style="display:flex; flex-direction:column; gap:12px; margin-top:20px;">
      <button type="submit" class="btn btn-primary">Se connecter</button>
      <p style="text-align:center; font-size:12.5px; color:var(--text-faint);">
        Pas encore de compte ? <a href="terms.html?next=signup" style="color:var(--blue-accent); text-decoration:none;">Créer un compte</a>
      </p>
    </div>
  </form>

</main>
<script src="js/app.js"></script>
</body>
</html>
