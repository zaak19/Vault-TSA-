<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault TSA — Accueil</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  #welcome-screen {
    position: relative;
    padding: 0;
    overflow: hidden;
    justify-content: flex-end;
  }
  .splash-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: 0;
    transform: scale(1.12);
    animation: vaultBgIn 1.4s ease-out 0s forwards,
               vaultBgZoom 9s ease-out 0s forwards;
  }
  @keyframes vaultBgIn {
    0%   { opacity: 0; }
    100% { opacity: 1; }
  }
  @keyframes vaultBgZoom {
    0%   { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  .splash-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(3,16,28,0) 45%, rgba(3,16,28,0.55) 70%, rgba(3,16,28,0.92) 100%);
    pointer-events: none;
  }
  .splash-content {
    position: relative;
    z-index: 2;
    width: 100%;
    box-sizing: border-box;
    padding: 0 22px 28px;
    opacity: 0;
    transform: translateY(16px);
    animation: vaultFadeUp 0.7s ease-out 1.15s forwards;
  }
  @keyframes vaultFadeUp {
    0%   { opacity: 0; transform: translateY(16px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  /* Si l'animation a déjà été vue dans cette session, on affiche tout directement */
  .vault-anim-skip .splash-bg { opacity: 1; transform: scale(1); animation: none; }
  .vault-anim-skip .splash-content { opacity: 1; transform: translateY(0); animation: none; }
</style>
</head>
<body>
<main class="screen theme-dark" id="welcome-screen">

  <img class="splash-bg" src="splash-bg.png" alt="Vault TSA">
  <div class="splash-scrim"></div>

  <div class="splash-content">
    <a href="terms.html?next=signup" class="btn btn-primary" style="margin-bottom:12px;">Créer un compte</a>
    <a href="login.html" class="btn btn-outline">Se connecter</a>
    <p style="text-align:center; font-size:12px; color:var(--text-ghost); margin-top:10px;">
      En continuant, vous acceptez nos conditions d'utilisation
    </p>
  </div>

</main>
<script src="app.js"></script>
<script>
  // L'animation d'entrée ne se rejoue qu'une fois par session
  if (sessionStorage.getItem('vault_splash_seen')) {
    document.getElementById('welcome-screen').classList.add('vault-anim-skip');
  } else {
    sessionStorage.setItem('vault_splash_seen', '1');
  }
</script>
</body>
</html>
