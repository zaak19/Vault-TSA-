<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault TSA — Vendre mon contact (2/2)</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<main class="screen theme-dark">

  <button class="back-link" onclick="window.location.href='seller-step1.html'"><i class="ti ti-arrow-left"></i><span class="title">Vendre mon contact</span></button>
  <p class="step-label" style="padding-left:26px;">Étape 2 sur 2</p>
  <div class="progress"><div class="bar filled"></div><div class="bar filled"></div></div>

  <p class="section-label">Lieu de résidence</p>
  <div class="field-row" style="margin-bottom:20px;">
    <div class="field" style="margin-bottom:0;">
      <label>Pays</label>
      <div class="country-select">🇫🇷 <span style="flex:1;">France</span> <i class="ti ti-chevron-down"></i></div>
    </div>
    <div class="field" style="margin-bottom:0;">
      <label>Ville</label>
      <input type="text" placeholder="Paris">
    </div>
  </div>

  <div class="field">
    <label>Numéro d'appel</label>
    <div class="phone-row">
      <div class="country-code">🇫🇷 +33 <i class="ti ti-chevron-down" style="font-size:13px;"></i></div>
      <input type="tel" placeholder="6 00 00 00 00">
    </div>
  </div>

  <div class="field">
    <label>Numéro WhatsApp</label>
    <div class="phone-row">
      <div class="country-code">🇫🇷 +33 <i class="ti ti-chevron-down" style="font-size:13px;"></i></div>
      <input type="tel" placeholder="6 00 00 00 00">
    </div>
    <p class="field-hint">Indicatif repris automatiquement du numéro d'appel — modifiable si différent</p>
  </div>

  <div class="field">
    <label>Description publique</label>
    <textarea placeholder="Présentez-vous en quelques mots..."></textarea>
  </div>

  <p class="legal-note">
    En activant la vente, vous confirmez que ces coordonnées sont les vôtres et acceptez
    qu'elles soient révélées aux acheteurs après paiement.
  </p>

  <button class="btn btn-primary" onclick="alert('Profil publié (démo).'); window.location.href='browse.html';">Publier mon profil</button>

</main>
<script src="app.js"></script>
</body>
</html>
