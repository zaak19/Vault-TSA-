<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault TSA — Profil publié</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<main class="screen theme-dark" style="align-items:center; justify-content:center; text-align:center; padding:40px 24px;">

  <div style="width:72px; height:72px; border-radius:50%; background:var(--success-bg); display:flex; align-items:center; justify-content:center; margin-bottom:22px;">
    <i class="ti ti-rosette-discount-check" style="font-size:34px; color:var(--success);"></i>
  </div>

  <p style="font-size:18px; font-weight:600; margin-bottom:10px;">Identité vérifiée</p>
  <p style="font-size:13.5px; color:var(--text-muted); line-height:1.6; margin-bottom:24px;">
    Votre profil vendeur a été validé et est maintenant<br>
    <strong style="color:#fff;">publié sur Vault TSA</strong>.
  </p>

  <div class="card" style="width:100%; display:flex; align-items:center; gap:12px; margin-bottom:20px; text-align:left;">
    <i class="ti ti-shield-check" style="font-size:20px; color:var(--blue-accent); flex-shrink:0;"></i>
    <p style="font-size:12px; color:var(--text-muted); line-height:1.5;">
      Votre profil affiche désormais le badge « Vérifié » et est visible par tous les acheteurs.
    </p>
  </div>

  <a href="browse.html" class="btn btn-primary" style="width:100%;">Voir mon profil en ligne</a>

</main>
<script src="app.js"></script>
</body>
</html>
