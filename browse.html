<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault TSA — Accueil</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<main class="screen theme-dark">

  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;">
    <p style="font-size:18px; font-weight:600;">Vault TSA</p>
    <a href="profile-edit.html" class="icon-btn" style="border-radius:50%; text-decoration:none;">
      <i class="ti ti-user"></i>
    </a>
  </div>

  <div style="position:relative; margin-bottom:28px;">
    <i class="ti ti-search" style="position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--text-faint);"></i>
    <input type="text" placeholder="Rechercher une célébrité, une personnalité"
      style="width:100%; height:46px; border-radius:12px; background:var(--navy-800); border:0.5px solid var(--navy-line); color:#fff; padding:0 14px 0 40px; font-size:13.5px;">
  </div>

  <p class="section-label">Contacts disponibles</p>

  <div style="display:flex; flex-direction:column; gap:16px; flex:1;">

    <a href="profile-detail.html?name=A.%20M.&price=2400&cat=Personnalit%C3%A9%20publique" class="list-row">
      <div class="avatar">A.M</div>
      <div style="flex:1; min-width:0;">
        <p style="font-size:14px; font-weight:600;">A. M.</p>
        <p style="font-size:12px; color:var(--text-faint); margin-top:3px;">Personnalité publique · Vérifié</p>
      </div>
      <div style="text-align:right; flex-shrink:0;">
        <p style="font-size:14px; font-weight:600; color:var(--blue-accent);">2 400 $</p>
        <i class="ti ti-lock" style="font-size:13px; color:var(--text-faint);"></i>
      </div>
    </a>

    <a href="profile-detail.html?name=S.%20K.&price=780&cat=Cr%C3%A9ateur%20de%20contenu" class="list-row">
      <div class="avatar">S.K</div>
      <div style="flex:1; min-width:0;">
        <p style="font-size:14px; font-weight:600;">S. K.</p>
        <p style="font-size:12px; color:var(--text-faint); margin-top:3px;">Créateur de contenu · Vérifié</p>
      </div>
      <div style="text-align:right; flex-shrink:0;">
        <p style="font-size:14px; font-weight:600; color:var(--blue-accent);">780 $</p>
        <i class="ti ti-lock" style="font-size:13px; color:var(--text-faint);"></i>
      </div>
    </a>

    <a href="profile-detail.html?name=R.%20D.&price=15000&cat=Entrepreneur" class="list-row">
      <div class="avatar">R.D</div>
      <div style="flex:1; min-width:0;">
        <p style="font-size:14px; font-weight:600;">R. D.</p>
        <p style="font-size:12px; color:var(--text-faint); margin-top:3px;">Entrepreneur · Vérifié</p>
      </div>
      <div style="text-align:right; flex-shrink:0;">
        <p style="font-size:14px; font-weight:600; color:var(--blue-accent);">15 000 $</p>
        <i class="ti ti-lock" style="font-size:13px; color:var(--text-faint);"></i>
      </div>
    </a>

  </div>

  <nav class="tabbar">
    <a href="browse.html" class="tab active"><i class="ti ti-home" style="font-size:20px;"></i><span>Accueil</span></a>
    <a href="#" class="tab"><i class="ti ti-heart" style="font-size:20px;"></i><span>Favoris</span></a>
    <a href="settings.html" class="tab"><i class="ti ti-settings" style="font-size:20px;"></i><span>Paramètres</span></a>
  </nav>

</main>
<script src="app.js"></script>
</body>
</html>
