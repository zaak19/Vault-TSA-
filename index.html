<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault TSA — Accueil</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
<main class="screen theme-dark" style="justify-content: space-between;">

  <div class="spacer"></div>

  <div class="logo-wrap">
    <svg width="100" height="100" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo Vault TSA">
      <defs>
        <linearGradient id="vblue" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#3fa9ff"/>
          <stop offset="100%" stop-color="#0a3d6b"/>
        </linearGradient>
      </defs>
      <path d="M30 62 L82 62 L100 150 L118 62 L170 62 L110 175 L90 175 Z" fill="url(#vblue)"/>
      <path d="M118 62 L170 62 L120 150 Z" fill="#2b2f36" opacity="0.9"/>
      <circle cx="100" cy="95" r="6" fill="#061524"/>
      <path d="M75 68 v-15 a25 25 0 0 1 50 0 v15" fill="none" stroke="#3fa9ff" stroke-width="9"/>
      <rect x="72" y="66" width="56" height="42" rx="10" fill="#0a3d6b"/>
      <rect x="94" y="82" width="12" height="18" rx="4" fill="#3fa9ff"/>
    </svg>
    <div style="text-align:center;">
      <p class="brand-name">Vault TSA</p>
      <p class="brand-tag">Votre contact, votre valeur</p>
    </div>
  </div>

  <div class="spacer"></div>

  <div>
    <a href="terms.html?next=signup" class="btn btn-primary" style="margin-bottom:12px;">Créer un compte</a>
    <a href="login.html" class="btn btn-outline">Se connecter</a>
    <p style="text-align:center; font-size:12px; color:var(--text-ghost); margin-top:10px;">
      En continuant, vous acceptez nos conditions d'utilisation
    </p>
  </div>

</main>
<script src="app.js"></script>
</body>
</html>
